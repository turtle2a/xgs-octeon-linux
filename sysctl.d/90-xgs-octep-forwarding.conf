# Enable routing before applying per-interface IPv4 settings; changing
# net.ipv4.ip_forward resets IPv4 configuration to router defaults.
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.default.forwarding = 1
net.ipv4.conf.all.bc_forwarding = 1

net.ipv4.conf.octep0.forwarding = 1
