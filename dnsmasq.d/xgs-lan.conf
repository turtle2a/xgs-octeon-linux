# DHCP for the OCTEP LAN ports (managed by xgs-octeon-linux).
# octep0 = 10.4.4.0/28, octepN (N >= 2) = 10.4.(10+N).0/28; router at .10 on each.
# octep1 (WAN) and enp2s0 (management) are never served.
bind-dynamic
dhcp-authoritative
interface=octep0
interface=octep2
interface=octep3
interface=octep4
interface=octep5
interface=octep6
interface=octep7
interface=octep8
interface=octep9
dhcp-range=10.4.4.2,10.4.4.9,255.255.255.240,12h
dhcp-range=10.4.12.2,10.4.12.9,255.255.255.240,12h
dhcp-range=10.4.13.2,10.4.13.9,255.255.255.240,12h
dhcp-range=10.4.14.2,10.4.14.9,255.255.255.240,12h
dhcp-range=10.4.15.2,10.4.15.9,255.255.255.240,12h
dhcp-range=10.4.16.2,10.4.16.9,255.255.255.240,12h
dhcp-range=10.4.17.2,10.4.17.9,255.255.255.240,12h
dhcp-range=10.4.18.2,10.4.18.9,255.255.255.240,12h
dhcp-range=10.4.19.2,10.4.19.9,255.255.255.240,12h
