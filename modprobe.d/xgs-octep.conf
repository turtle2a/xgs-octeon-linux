# Do not let PCI modalias probing bind the diagnostic driver automatically.
blacklist octep
# NPU flow offload is OFF by default (forwarded TCP flows stall, so the host path carries traffic).
# To opt in: uncomment the next line and add scripts/octep/offload-enable.sh as an ExecStartPost of
# xgs-octep-sdp-bringup.service (systemctl edit), or run it by hand after boot.
# options octep flow_offload=1
# Optional XGS 2300 SR-IOV: uncomment to enable four VFs before SDP bring-up.
# options octep sriov_vfs=4
