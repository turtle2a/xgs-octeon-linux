// DHCPv4 for the OCTEP LAN ports (managed by xgs-octeon-linux).
// octep0 = 10.4.4.0/28, octepN (N >= 2) = 10.4.(10+N).0/28; router at .10 on each.
// Binds every port, but Kea only answers on ports whose address is inside a
// subnet below, so octep1 (WAN) and enp2s0 (management) are never served.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "*" ],
      "dhcp-socket-type": "raw",
      "re-detect": true,
      "service-sockets-require-all": false,
      "service-sockets-max-retries": 30,
      "service-sockets-retry-wait-time": 2000
    },
    "lease-database": { "type": "memfile", "lfc-interval": 3600 },
    "valid-lifetime": 43200,
    "option-data": [
      { "name": "domain-name-servers", "data": "8.8.8.8, 1.1.1.1" }
    ],
    "subnet4": [
    {
      "id": 1,
      "subnet": "10.4.4.0/28",
      // Static leases (for example the 10.4.4.2 test client) live outside the
      // repo in /etc/kea/xgs-reservations.json, a list of host reservations
      "reservations": <?include "/etc/kea/xgs-reservations.json"?>,
      "pools": [ { "pool": "10.4.4.2 - 10.4.4.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.4.10" } ]
    },
    {
      "id": 2,
      "subnet": "10.4.12.0/28",
      "pools": [ { "pool": "10.4.12.2 - 10.4.12.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.12.10" } ]
    },
    {
      "id": 3,
      "subnet": "10.4.13.0/28",
      "pools": [ { "pool": "10.4.13.2 - 10.4.13.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.13.10" } ]
    },
    {
      "id": 4,
      "subnet": "10.4.14.0/28",
      "pools": [ { "pool": "10.4.14.2 - 10.4.14.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.14.10" } ]
    },
    {
      "id": 5,
      "subnet": "10.4.15.0/28",
      "pools": [ { "pool": "10.4.15.2 - 10.4.15.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.15.10" } ]
    },
    {
      "id": 6,
      "subnet": "10.4.16.0/28",
      "pools": [ { "pool": "10.4.16.2 - 10.4.16.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.16.10" } ]
    },
    {
      "id": 7,
      "subnet": "10.4.17.0/28",
      "pools": [ { "pool": "10.4.17.2 - 10.4.17.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.17.10" } ]
    },
    {
      "id": 8,
      "subnet": "10.4.18.0/28",
      "pools": [ { "pool": "10.4.18.2 - 10.4.18.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.18.10" } ]
    },
    {
      "id": 9,
      "subnet": "10.4.19.0/28",
      "pools": [ { "pool": "10.4.19.2 - 10.4.19.9" } ],
      "option-data": [ { "name": "routers", "data": "10.4.19.10" } ]
    }
    ],
    "loggers": [
      { "name": "kea-dhcp4", "output_options": [ { "output": "stdout" } ], "severity": "INFO" }
    ]
  }
}
